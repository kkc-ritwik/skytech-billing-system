appId: com.shailee.grms
productName: Shailee-GRMS
copyright: Copyright © 2026 Shailee

directories:
  buildResources: build
  output: release/${version}

files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintrc,.eslintrc.cjs,.prettierrc,.prettierignore,.editorconfig}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json,drizzle.config.ts}'
  - '!{.env,.env.*,.npmrc}'
  - '!scripts/*'
  - '!admin-portal/*'
  - '!*.private.pem'

# libSQL ships prebuilt N-API binaries (ABI-stable) — no native rebuild needed.
npmRebuild: false

asarUnpack:
  # Native .node binaries must live on disk (not inside asar) to load.
  - '**/node_modules/@libsql/**'
  - '**/node_modules/libsql/**'

extraResources:
  # SQL migrations are applied at runtime against the user's local DB.
  - from: src/main/db/migrations
    to: migrations
    filter: ['**/*']

win:
  executableName: ShaileeGRMS
  icon: build/icon.png
  # Embedding the exe icon and signing both need the same Windows toolchain,
  # which requires Developer Mode / admin. Left off so an unsigned build works
  # anywhere; `npm run build:win:signed` overrides it to true on the CLI.
  signAndEditExecutable: false
  target:
    - target: nsis
      arch:
        - x64
  # ---- Code signing -------------------------------------------------------
  # Nothing here is secret: the certificate and its password are supplied by
  # environment variables at build time, so the .pfx never enters the repo.
  #
  #   set CSC_LINK=C:\path\to\certificate.pfx
  #   set CSC_KEY_PASSWORD=<password>
  #   npm run build:win:signed
  #
  # electron-builder reads CSC_LINK / CSC_KEY_PASSWORD automatically. For an EV
  # certificate on a hardware token, leave those unset and use the token's own
  # signing tool via `signtool` — see docs/CODE-SIGNING.md.
  signtoolOptions:
    signingHashAlgorithms:
      - sha256
    # A timestamp means signatures stay valid after the certificate expires.
    timeStampServer: http://timestamp.digicert.com
    rfc3161TimeStampServer: http://timestamp.digicert.com

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Shailee-GRMS
  artifactName: Shailee-GRMS-Setup-${version}.${ext}
  deleteAppDataOnUninstall: false

# Auto-update feed. Point this at your release host (GitHub Releases, S3, or a
# generic web server) when you start publishing builds.
publish:
  provider: generic
  url: https://updates.shailee.example/releases/
